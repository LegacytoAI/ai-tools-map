
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Toolscape (v6.7, Stable)</title>
<style>
  :root { --bg:#0b0f14; --card:#0f1520; --muted:#a4b3c6; --text:#e7eef6; --border:#233041; --primary:#4da3ff; --secondary:#7efcc6; }
  *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Noto Sans KR','Malgun Gothic',Arial;background:#0b0f14;color:var(--text)}
  header{border-bottom:1px solid var(--border);background:rgba(12,19,32,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:1000}
  .wrap{max-width:1200px;margin:0 auto;padding:16px 20px}
  .brand h1{margin:0;font-size:19px;letter-spacing:.3px} .brand .sub{color:var(--muted);font-size:12.5px}
  .toolbar{display:grid;grid-template-columns:1fr auto auto auto auto auto;gap:10px;margin-top:12px;align-items:center}
  .search,select,button,input[type="url"],input[type="number"],input[type="file"]{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:14px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr);padding:18px 20px}
  .card{grid-column:span 6;background:#0f1726;border:1px solid var(--border);border-radius:14px;padding:14px}
  .card h3{margin:0 0 8px;font-size:16px;color:var(--primary);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pill{background:#092032;color:#bfe6ff;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid #1e3953}
  table{width:100%;border-collapse:collapse;font-size:13.2px}
  th,td{border-bottom:1px solid #19263a;padding:8px 8px;text-align:left;vertical-align:top}
  th{color:#a9bad1;font-size:12px} a.tool{color:#dbeaff;text-decoration:none;border-bottom:1px dashed #335b8f} a.tool:hover{color:#fff;border-bottom-color:#5aa9ff}
  .lvl{font-size:11px;color:#0c1522;background:#8fd1ff;border:1px solid #2b4f73;padding:2px 8px;border-radius:999px}
  .tags{display:flex;flex-wrap:wrap;gap:6px} .tag{font-size:11px;border:1px solid #2a3d57;padding:2px 8px;border-radius:999px;background:#0e2035;color:#cfe6ff}
  .footer{color:#90a4bf;padding:20px} .small{font-size:12px;color:#a8bad1}
  .count{margin-left:8px;font-size:12px;color:#9ecbff}
  @media (max-width:1024px){.card{grid-column:span 12}.toolbar{grid-template-columns:1fr}}
  @media print{ html,body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact} header{position:static;background:#fff;color:#000;border:none} .wrap{max-width:100%;padding:0 8mm} .toolbar,.print-btn{display:none!important} .grid{padding:0;gap:8mm;grid-template-columns:1fr} .card{background:#fff;border:1px solid #000;page-break-inside:avoid} .card h3{color:#000} .pill{background:#fff;color:#000;border:1px solid #000} table{font-size:12pt} th,td{border-color:#000} a.tool{color:#000 !important;text-decoration:underline;border-bottom:none} .lvl{background:#fff;color:#000;border:1px solid #000} .tag{background:#fff;color:#000;border:1px solid #000} @page{size:A4;margin:10mm} }

/* Print: append URL after hyperlinks for offline readers */
@media print {
  a.tool[href^="http"]::after {
    content: " (" attr(href) ")";
    font-size: 9pt;
    color:#000;
  }
}

/* === Print Optimization v2 === */
@media print {
  html, body {
    background: #fff !important;
    color: #000 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-size: 10.75pt; /* slightly condensed to reduce overflow */
    line-height: 1.35;
  }
  header {
    position: static !important;
    background: #fff !important;
    color: #000 !important;
    border: none !important;
    box-shadow: none !important;
  }
  .wrap { max-width: 100% !important; padding: 0 10mm !important; }
  .toolbar, .print-btn, .tooltip, .tipbox, #status, .count { display: none !important; }
  .grid {
    padding: 0 !important;
    gap: 10mm !important;
    grid-template-columns: 1fr !important;
  }
  .card {
    background: #fff !important;
    border: 1px solid #000 !important;
    box-shadow: none !important;
    page-break-inside: avoid !important;
    break-inside: avoid-page !important;
    -webkit-region-break-inside: avoid;
    padding: 10mm !important; /* room for inner table */
  }
  .grid .card:first-child { margin-top: 6mm !important; }
  /* Start each category card on a new page for clarity */
  .card + .card { page-break-before: always !important; break-before: page !important; }
  .card h3 { color: #000 !important; }
  .pill, .lvl, .tag {
    background: #fff !important;
    color: #000 !important;
    border: 1px solid #000 !important;
  }
  table {
    font-size: 10.25pt !important;
    width: 100% !important;
    border-collapse: collapse !important;
    table-layout: fixed !important; /* avoid column drift */
  }
  th, td {
    border-color: #000 !important;
    border-bottom: 1px solid #000 !important;
    padding: 5pt 5pt !important;
    word-wrap: break-word !important;
    overflow-wrap: anywhere !important;
  }
  thead { display: table-header-group !important; }
  tfoot { display: table-footer-group !important; }
  tr { page-break-inside: avoid !important; break-inside: avoid-page !important; }
  a.tool {
    color: #000 !important;
    text-decoration: underline !important;
    border-bottom: none !important;
  }
  /* Append URL to links for offline readability */
  a.tool[href^="http"]::after {
    content: " (" attr(href) ")";
    font-size: 9pt;
    color: #000;
  }
}
@page { size: A4 portrait; margin: 10mm; }
/* === End Print Optimization v2 === */

/* === Compact Print Mode (v3-compact) === */
@media print {
  html, body {
    font-size: 9.8pt !important;      /* down from 10.75pt */
    line-height: 1.28 !important;
  }
  @page { size: A4 portrait; margin: 8mm !important; }  /* tighter margins */
  .wrap { padding: 0 8mm !important; }
  .grid { gap: 6mm !important; }      /* less vertical spacing between cards */
  .card {
    padding: 6mm !important;          /* down from 10mm */
    border-width: 0.8pt !important;
  }
  .card + .card {
    page-break-before: auto !important;   /* allow multiple cards per page */
    break-before: auto !important;
  }
  table { font-size: 9.2pt !important; }  /* down from 10.25pt */
  th, td { padding: 4pt 4pt !important; }
  .pill, .lvl, .tag { font-size: 8.8pt !important; padding: 1.5pt 5pt !important; }
  .brand h1 { font-size: 14pt !important; }
}
/* === End Compact Print Mode === */


/* === Landscape Default Print (v5) === */
@media print {
  @page { size: A4 landscape; margin: 8mm; }     /* default to landscape */
  .wrap { padding: 0 8mm !important; }
  /* Use two columns in landscape to utilize width */
  .grid {
    grid-template-columns: 1fr 1fr !important;
    gap: 6mm !important;
  }
  .card { page-break-inside: avoid !important; }
  /* Avoid forcing new page between cards in landscape */
  .card + .card { page-break-before: auto !important; break-before: auto !important; }
}
/* === End Landscape Default === */

</style>
</head>

<option value="대본 생성 관련">대본 생성 관련</option>

<option value="검색(search)  관련">검색(search)  관련</option>
<option value="MLOps / 운영 / 배포 관련">MLOps / 운영 / 배포 관련</option>
<option value="LLM의 종류">LLM의 종류</option>
<option value="MCP의 종류">MCP의 종류</option></select>
      <button id="reset">필터 초기화</button>
      <div class="small">마지막 업데이트: <span id="last"></span></div>
    </div>
  </div>
</header>

<main class="grid" id="cards"></main>

function filterData(){
  const term = q.value.trim().toLowerCase();
  const cat = catSel.value;
  return DATA.filter(r => {
    if(cat && r["카테고리"] !== cat) return false;
    if(!term) return true;
    const hay = (r["카테고리"] + ' ' + r["툴"] + ' ' + r["역할"] + ' ' + r["난이도"] + ' ' + (r["태그"]||'')).toLowerCase();
    return hay.includes(term);
  });
}

function groupByCategory(rows){
  const map = {};
  for(const r of rows){
    const c = r["카테고리"] || "기타";
    if(!map[c]) map[c] = [];
    map[c].push(r);
  }
  return map;
}

}

function parseCSV(text){
  const rows=[]; let i=0, cur='', inQ=false, row=[];
  while(i<text.length){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; }
    else { if(ch==='"') inQ=true; else if(ch===','){ row.push(cur); cur=''; } else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(ch!=='\r'){ cur+=ch; } }
    i++;
  }
  if(cur.length>0 || row.length>0){ row.push(cur); rows.push(row); }
  return rows;
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(rows.length===0) return [];
  const header = rows[0];
  return rows.slice(1).filter(r=>r.length>1).map(r=>Object.fromEntries(header.map((h,idx)=>[h, r[idx]||''])));
}
function normalizeRows(rows){
  return rows.map(r => ({"카테고리": r["카테고리"]||r["category"]||"", "툴": r["툴"]||r["tool"]||r["name"]||"", "역할": r["역할"]||r["role"]||"", "URL": r["URL"]||r["url"]||"", "난이도": r["난이도"]||r["level"]||"", "태그": r["태그"]||r["tags"]||""}));
}

  setStatus('불러오는 중…');
  try{
    const res = await fetch(url + (url.includes('?')?'&':'?') + 'cb='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const ct = res.headers.get('content-type')||'';
    const text = await res.text();
    let rows = (ct.includes('json') || url.toLowerCase().endsWith('.json')) ? JSON.parse(text) : csvToObjects(text);
    if(!Array.isArray(rows)) throw new Error('형식 오류');
    DATA = normalizeRows(rows);
    render(); last.textContent = nowStr(); setStatus('완료'); updateRowCount();
  }catch(e){ console.error(e); setStatus('에러: '+e.message); }
}

// Controls
q.addEventListener('input', render);
catSel.addEventListener('change', render);
resetBtn.addEventListener('click', () => { q.value=''; catSel.value=''; render(); });
printBtn.addEventListener('click', () => window.print());
loadBtn.addEventListener('click', () => { if(src.value) fetchDataFrom(src.value); });
saveBtn.addEventListener('click', () => { if(src.value) localStorage.setItem('toolscape.dataURL', src.value); setStatus('URL 저장됨'); });
restoreBtn.addEventListener('click', () => { DATA = JSON.parse(JSON.stringify(EMBEDDED_DATA)); ORDER = JSON.parse(JSON.stringify(EMBEDDED_ORDER)); render(); setStatus('임베드 데이터 복원'); });
fileInput.addEventListener('change', async (ev) => {
  const f = ev.target.files[0]; if(!f) return;
  const text = await f.text();
  let rows; try{ rows = f.name.endsWith('.json') ? JSON.parse(text) : csvToObjects(text); }
  catch(e){ setStatus('파일 파싱 실패'); return; }
  DATA = normalizeRows(rows); render(); last.textContent = nowStr(); setStatus('업로드 완료'); updateRowCount();
});

// Auto refresh
let timer=null;
function applyAutoRefresh(){
  const hours = parseInt(every.value||'0',10);
  if(timer){ clearInterval(timer); timer=null; }
  if(hours>0){
    localStorage.setItem('toolscape.autoHours', String(hours));
    timer = setInterval(() => { const url = localStorage.getItem('toolscape.dataURL'); if(url) fetchDataFrom(url); }, hours*3600*1000);
    setStatus('자동 새로고침: ' + hours + '시간 간격');
  } else { localStorage.removeItem('toolscape.autoHours'); setStatus('자동 새로고침 꺼짐'); }
}
every.addEventListener('change', applyAutoRefresh);

// Snapshot buttons
function downloadSnapshot(label){
  try {
    const ts = new Date().toISOString().replace(/[-:]/g,'').slice(0,15);
    const fileName = `AI_Tools_Catalog_Snapshot_${ts}.html`;
    let htmlText = document.documentElement.outerHTML;
    htmlText = htmlText.replace(/AI Toolscape \(v6\.[0-9]+,.*?\)/, 'AI Toolscape ('+label+')');
    const dataLiteral = JSON.stringify(DATA).replace(/<\//g,'<\/');
    const orderLiteral = JSON.stringify(ORDER);
    htmlText = htmlText.replace(/const EMBEDDED_DATA = .*?;\nconst EMBEDDED_ORDER = /s, 'const EMBEDDED_DATA = '+dataLiteral+';\nconst EMBEDDED_ORDER = ');
    htmlText = htmlText.replace(/const EMBEDDED_ORDER = .*?;\nlet DATA/s, 'const EMBEDDED_ORDER = '+orderLiteral+';\nlet DATA');
    const blob = new Blob([htmlText], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    setStatus('스냅샷 저장 완료');
  } catch(e){ alert('스냅샷 오류: '+e.message); }
}
document.getElementById('exportBtn').addEventListener('click', () => downloadSnapshot('v6.7 Snapshot'));
document.getElementById('refreshSnapshotBtn').addEventListener('click', async () => {
  const saved = localStorage.getItem('toolscape.dataURL');
  if(!saved){ alert('저장된 데이터 소스 URL이 없습니다. [URL 저장]을 먼저 눌러주세요.'); return; }
  await fetchDataFrom(saved); downloadSnapshot('v6.7 Snapshot');
});

// Init (render embedded first)
(function init(){
  const stored = localStorage.getItem('toolscape.dataURL'); if(stored) src.value = stored;
  const h = Number(localStorage.getItem('toolscape.autoHours')||'0'); if(h>0){ every.value = String(h); applyAutoRefresh(); }
  last.textContent = nowStr();
  render(); // embedded first
})();
</script>
